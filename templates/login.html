{% load static %}
{% load sass_tags %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <link href="https://fonts.googleapis.com/css?family=Courgette&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% sass_src 'pages/login/style.scss' %}" type="text/css">

</head>
<body>
    <div class="login">
        <img src="/static/common/myapp_icon.png" alt="" class="icon">

        <h1>Welcome To My Application</h1>

        {% if form.errors  %}
        <p>User ID or the password is incorrect.</p>
        {% endif %}
        <form method="POST" action="{% url 'login' %}" class="column">
            <div class="column">
                <label>User ID</label>
                {{ form.username }}
                {{ form.username.errors }}
            </div>
            <div class="column">
                <label>Password</label>
                {{ form.password }}
                {{ form.password.errors }}
            </div>
            {% csrf_token %}
            <button type="submit">Login</button>
    </div>
    </form>
    </div>
</body>
</html>
